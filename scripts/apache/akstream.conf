# /etc/apache2/sites-available/akstream.conf
# a2enmod rewrite headers ssl proxy proxy_http ; certbot --apache -d stream.example.com
<VirtualHost *:80>
    ServerName stream.example.com
    Redirect permanent / https://stream.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName stream.example.com
    DocumentRoot /var/www/akstream/current/public

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/stream.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/stream.example.com/privkey.pem

    <Directory /var/www/akstream/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve storage / .env / hidden files
    <DirectoryMatch "^/var/www/akstream/current/(storage|bootstrap|database|vendor)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Optional: HLS preview proxied from MediaMTX (localhost only by default)
    # ProxyPass /hls/ http://127.0.0.1:8888/
    # ProxyPassReverse /hls/ http://127.0.0.1:8888/

    # Cache static assets
    <LocationMatch "\.(css|js|svg|png|jpg|webp|woff2)$">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/akstream-error.log
    CustomLog ${APACHE_LOG_DIR}/akstream-access.log combined
</VirtualHost>
